name: Compilar APK Cordova

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar Cordova
        run: |
          npm install -g cordova

      - name: Crear proyecto Cordova y compilar APK
        run: |
          # 1. Crear proyecto en carpeta independiente
          cordova create build_env com.juego.pario Pario
          
          # 2. Copiar archivos HTML/CSS/JS descartando carpetas de sistema
          rsync -av --exclude='build_env' --exclude='.git' --exclude='.github' ./ build_env/www/
          
          # 3. Acceder a la carpeta del proyecto
          cd build_env
          
          # 4. Agregar plataforma Android y Plugin de Notificaciones
          cordova platform add android@12.0.0
          cordova plugin add cordova-plugin-local-notification
          
          # 5. Compilar APK Debug
          cordova build android --debug

      - name: Subir APK Generado
        uses: actions/upload-artifact@v4
        with:
          name: Juego-Pario-APK
          path: build_env/platforms/android/app/build/outputs/apk/debug/app-debug.apk
