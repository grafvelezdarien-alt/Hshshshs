name: Compilar APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Entorno Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Capacitor y preparar proyecto
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Reloj App" "com.ejemplo.relojapp" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Compilar APK ejecutable
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir el archivo APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: RelojApp-Instalable
          path: android/app/build/outputs/apk/debug/app-debug.apk
