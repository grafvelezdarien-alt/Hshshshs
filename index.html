<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Reloj</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
    background: #0b1020;
    background-image: radial-gradient(1100px 520px at 50% -12%, #1c2b55 0%, transparent 62%), linear-gradient(180deg, #0d1326, #080b17);
    color: #eef1f8;
    text-align: left;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  :root { --acc: #ffb054; --acc-dim: rgba(255,176,84,.16); }
  #app {
    display: flex; flex-direction: column;
    height: 100dvh; max-width: 560px; margin: 0 auto;
  }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px 4px;
  }
  .brand { font-size: 13px; letter-spacing: 1.6px; color: #8a94ad; text-transform: uppercase; font-weight: 700; }
  .brand b { color: #fff; }
  .hdr-right { display: flex; align-items: center; gap: 10px; }
  .hdr-date { font-size: 12px; color: #8a94ad; }
  .h12btn {
    background: rgba(255,255,255,.06); color: #c8d2ec; border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px; padding: 5px 10px; font-size: 11.5px; font-weight: 700; cursor: pointer;
  }
  .h12btn:active { transform: scale(.96); }

  nav.tabs {
    display: flex; gap: 4px; margin: 8px 14px 4px;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07);
    border-radius: 16px; padding: 5px;
  }
  nav.tabs button {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 8px 2px 7px; background: transparent; border: none; border-radius: 12px;
    color: #6f7a96; font-size: 10.5px; font-weight: 600; cursor: pointer;
    font-family: inherit; transition: color .15s, background .15s;
  }
  nav.tabs button svg { width: 21px; height: 21px; }
  nav.tabs button.active { color: var(--acc); background: var(--acc-dim); }

  main { flex: 1; overflow-y: auto; padding: 4px 16px 20px; -webkit-overflow-scrolling: touch; }
  .panel { display: none; }
  .panel.active { display: block; animation: fadein .22s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .empty { text-align: center; color: #6f7a96; font-size: 13.5px; padding: 26px 10px; }

  .sectionhead { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 10px; }
  .sectionhead h2 { font-size: 12.5px; text-transform: uppercase; letter-spacing: 1.4px; color: #8a94ad; font-weight: 700; }
  .iconbtn {
    width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255,255,255,.07); color: #fff; font-size: 21px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .iconbtn:active { transform: scale(.93); background: var(--acc-dim); }

  /* ---------- Alarma ---------- */
  .bigclock { text-align: center; padding: 12px 0 6px; }
  .bigclock .time { font-size: 66px; font-weight: 200; letter-spacing: 2px; line-height: 1; font-variant-numeric: tabular-nums; }
  .bigclock .date { margin-top: 8px; color: #8a94ad; font-size: 13.5px; }
  .alarm-item {
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.07);
    border-radius: 16px; padding: 12px 14px; margin-bottom: 10px;
  }
  .alarm-item.off { opacity: .42; }
  .alarm-item .grow { flex: 1; min-width: 0; }
  .alarm-time { font-size: 30px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  .alarm-meta { margin-top: 6px; font-size: 12.5px; color: #8a94ad; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .alarm-days { margin-top: 3px; font-size: 11px; color: var(--acc); letter-spacing: 2.5px; font-weight: 600; }
  .delbtn {
    width: 30px; height: 30px; flex: none; border: none; border-radius: 50%; cursor: pointer;
    background: rgba(255,255,255,.05); color: #8a94ad; font-size: 14px; line-height: 1;
  }
  .delbtn:active { background: rgba(255,123,123,.25); color: #ff7b7b; }
  .switch { position: relative; width: 48px; height: 27px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: rgba(255,255,255,.13); border-radius: 14px; transition: .18s; cursor: pointer; }
  .slider::before {
    content: ""; position: absolute; width: 21px; height: 21px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: .18s;
  }
  .switch input:checked + .slider { background: var(--acc); }
  .switch input:checked + .slider::before { transform: translateX(21px); }

  /* ---------- Modal ---------- */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(4,8,18,.72); backdrop-filter: blur(4px);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .modal-overlay.center { align-items: center; }
  .modal-overlay[hidden] { display: none; }
  .modal {
    width: 100%; max-width: 520px; background: #151b31;
    border: 1px solid rgba(255,255,255,.1); border-radius: 22px 22px 0 0;
    padding: 20px 20px 24px; animation: slideup .22s ease;
  }
  .modal-overlay.center .modal { border-radius: 22px; }
  @keyframes slideup { from { transform: translateY(46px); opacity: .4; } to { transform: none; opacity: 1; } }
  .modal h3 { font-size: 17px; margin-bottom: 14px; }
  .modal input[type="time"], .modal input[type="text"], .modal input[type="search"] {
    width: 100%; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px; color: #fff; padding: 12px 14px; font-size: 18px; margin-bottom: 10px;
    font-family: inherit;
  }
  .modal input[type="time"] { font-size: 30px; text-align: center; font-variant-numeric: tabular-nums; }
  input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: .7; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip {
    padding: 8px 13px; border-radius: 20px; cursor: pointer; font-family: inherit;
    border: 1px solid rgba(255,255,255,.15); background: transparent; color: #c8d2ec; font-size: 13px;
  }
  .chip.on { background: var(--acc); border-color: transparent; color: #141a30; font-weight: 700; }
  .daychips { display: flex; gap: 6px; justify-content: center; margin: 2px 0 14px; }
  .daychips .chip { width: 34px; padding: 8px 0; text-align: center; }
  .modal-btns { display: flex; gap: 10px; margin-top: 4px; }
  .modal-btns button {
    flex: 1; padding: 13px; border: none; border-radius: 12px; cursor: pointer;
    font-size: 15px; font-weight: 700; font-family: inherit;
  }
  .btn-ghost { background: rgba(255,255,255,.09); color: #fff; }
  .btn-primary { background: var(--acc); color: #141a30; }

  /* ---------- Reloj mundial ---------- */
  .city-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 390px) { .city-grid { grid-template-columns: 1fr; } }
  .city-card {
    position: relative; background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.07);
    border-radius: 16px; padding: 12px 14px 13px;
  }
  .city-card .delbtn { position: absolute; top: 9px; right: 9px; width: 26px; height: 26px; font-size: 12px; }
  .city-name { font-weight: 600; font-size: 14px; padding-right: 26px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .city-extra { font-size: 11.5px; color: #8a94ad; margin-top: 3px; }
  .city-extra b { color: #c8d2ec; font-weight: 600; }
  .city-time { font-size: 23px; font-weight: 600; letter-spacing: 1px; font-variant-numeric: tabular-nums; margin-top: 9px; }
  .city-pick { list-style: none; max-height: 44vh; overflow-y: auto; margin-top: 4px; }
  .city-pick li {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 11px 14px; border-radius: 10px; cursor: pointer; font-size: 15px;
  }
  .city-pick li small { color: #8a94ad; }
  .city-pick li:active { background: var(--acc-dim); }
  .city-pick li.added { opacity: .45; pointer-events: none; }

  /* ---------- Cronómetro ---------- */
  .sw-display { text-align: center; padding: 26px 0 18px; }
  .sw-time { font-size: 62px; font-weight: 200; letter-spacing: 1px; font-variant-numeric: tabular-nums; line-height: 1; }
  .sw-hint { color: #8a94ad; font-size: 13px; margin-top: 8px; min-height: 18px; }
  .sw-controls { display: flex; justify-content: center; gap: 16px; margin-top: 26px; }
  .ctrlbtn {
    width: 76px; height: 76px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255,255,255,.07); color: #c8d2ec; font-size: 13px; font-weight: 700;
    font-family: inherit; transition: transform .1s;
  }
  .ctrlbtn:active { transform: scale(.94); }
  .ctrlbtn:disabled { opacity: .35; }
  .ctrlbtn.primary { background: var(--acc); color: #141a30; font-size: 15px; }
  .ctrlbtn.primary.paused { background: #ffb054; }
  .sw-laps { list-style: none; margin-top: 18px; }
  .sw-laps li {
    display: flex; justify-content: space-between; padding: 10px 6px;
    border-bottom: 1px solid rgba(255,255,255,.06); font-size: 14px; font-variant-numeric: tabular-nums;
  }
  .sw-laps li .ln { color: #8a94ad; }
  .sw-laps li .split { color: #8a94ad; }
  .sw-laps li.best { color: #6fe07f; }
  .sw-laps li.worst { color: #ff7b7b; }
  .sw-laps li.best .split, .sw-laps li.worst .split { color: inherit; }

  /* ---------- Temporizador ---------- */
  .timer-wrap { text-align: center; }
  .timer-ring { position: relative; width: 236px; height: 236px; margin: 22px auto 4px; }
  .timer-ring svg { transform: rotate(-90deg); }
  .timer-ring circle { fill: none; stroke-width: 10; stroke-linecap: round; }
  .ring-bg { stroke: rgba(255,255,255,.09); }
  .ring-fg { stroke: var(--acc); transition: stroke-dashoffset .12s linear; }
  .timer-time {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 44px; font-weight: 200; font-variant-numeric: tabular-nums; letter-spacing: 1px;
  }
  .timer-state { color: #8a94ad; font-size: 13px; margin-top: 2px; min-height: 18px; }
  .timer-inputs { display: flex; gap: 12px; justify-content: center; margin: 16px 0 8px; }
  .timer-inputs > div { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .timer-inputs span { font-size: 11px; color: #8a94ad; }
  .timer-inputs input {
    width: 76px; padding: 10px 4px; text-align: center; font-size: 22px; color: #fff;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 12px;
    font-variant-numeric: tabular-nums; font-family: inherit;
  }
  .timer-inputs input:disabled { opacity: .35; }
  .timer-presets { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 10px 0 20px; }
  .timer-controls { display: flex; justify-content: center; gap: 16px; }
  .timer-controls .ctrlbtn.primary { background: var(--acc); }

  /* ---------- Alarma sonando ---------- */
  #ringOverlay {
    position: fixed; inset: 0; z-index: 100;
    background: radial-gradient(circle at 50% 38%, #2c1a06 0%, #120a02 68%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px;
  }
  #ringOverlay[hidden] { display: none; }
  .ring-clock { font-size: 72px; font-weight: 200; font-variant-numeric: tabular-nums; animation: pulse 1s ease infinite; }
  .ring-label { font-size: 30px; font-weight: 700; color: var(--acc); margin-top: 12px; text-align: center; line-height: 1.25; padding: 0 10px; max-width: 92vw; word-wrap: break-word; }
  .ring-now { color: #8a94ad; font-size: 14px; margin-top: 6px; }
  .ring-btns { display: flex; gap: 12px; margin-top: 40px; }
  .ring-btns button {
    padding: 15px 24px; border-radius: 16px; border: none; cursor: pointer;
    font-size: 15px; font-weight: 700; font-family: inherit;
  }
  #ringSnoozeBtn { background: rgba(255,255,255,.1); color: #fff; }
  #ringDismissBtn { background: #ffb054; color: #141a30; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

  #toast {
    position: fixed; left: 50%; bottom: 96px; transform: translate(-50%, 14px);
    background: rgba(20,26,48,.96); border: 1px solid rgba(255,255,255,.14); color: #fff;
    padding: 11px 18px; border-radius: 22px; font-size: 13.5px; z-index: 120;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
    max-width: 86vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>

<div id="app" data-tab="alarm">
  <header>
    <div class="brand">Reloj<b>.</b></div>
    <div class="hdr-right">
      <span class="hdr-date" id="hdrDate"></span>
      <button class="h12btn" id="h12Btn" onclick="toggleHour12()">24h</button>
    </div>
  </header>

  <nav class="tabs">
    <button id="navAlarm" class="active" onclick="switchTab('alarm')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      Alarma
    </button>
    <button id="navWorld" onclick="switchTab('world')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      Mundial
    </button>
    <button id="navStopwatch" onclick="switchTab('stopwatch')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9 2h6"/><path d="M10 1.5h4"/></svg>
      Cronómetro
    </button>
    <button id="navTimer" onclick="switchTab('timer')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12"/><path d="M6 21h12"/><path d="M7 3a5 5 0 0 0 5 4 5 5 0 0 0 5-4"/><path d="M7 21a5 5 0 0 1 5-4 5 5 0 0 1 5 4"/></svg>
      Temporizador
    </button>
  </nav>

  <main>
    <!-- ALARMA -->
    <section id="tabAlarm" class="panel active">
      <div class="bigclock">
        <div class="time" id="alarmClockTime">--:--</div>
        <div class="date" id="alarmClockDate"></div>
      </div>
      <div class="sectionhead">
        <h2>Alarmas</h2>
        <button class="iconbtn" id="addAlarmBtn" onclick="openAlarmModal()" title="Nueva alarma">+</button>
      </div>
      <div id="alarmList"></div>
    </section>

    <!-- RELOJ MUNDIAL -->
    <section id="tabWorld" class="panel">
      <div class="sectionhead">
        <h2>Reloj mundial</h2>
        <button class="iconbtn" id="addCityBtn" onclick="openCityModal()" title="Añadir ciudad">+</button>
      </div>
      <div class="city-grid" id="cityGrid"></div>
    </section>

    <!-- CRONÓMETRO -->
    <section id="tabStopwatch" class="panel">
      <div class="sw-display">
        <div class="sw-time" id="swTime">00:00.00</div>
        <div class="sw-hint" id="swHint">Listo</div>
      </div>
      <div class="sw-controls">
        <button class="ctrlbtn" id="swLapBtn" onclick="swLap()">Vuelta</button>
        <button class="ctrlbtn primary" id="swStartBtn" onclick="swToggle()">Iniciar</button>
        <button class="ctrlbtn" id="swResetBtn" onclick="swReset()">Reiniciar</button>
      </div>
      <ul class="sw-laps" id="swLaps"></ul>
    </section>

    <!-- TEMPORIZADOR -->
    <section id="tabTimer" class="panel">
      <div class="timer-wrap">
        <div class="timer-ring">
          <svg width="236" height="236" viewBox="0 0 236 236">
            <circle class="ring-bg" cx="118" cy="118" r="102"/>
            <circle class="ring-fg" id="ringFg" cx="118" cy="118" r="102" stroke-dasharray="640.88" stroke-dashoffset="0"/>
          </svg>
          <div class="timer-time" id="timerTime">05:00</div>
        </div>
        <div class="timer-state" id="timerState">Listo</div>
        <div class="timer-inputs">
          <div><input type="number" id="timerHourInput" min="0" max="99" value="0" oninput="timerInputsChanged()"><span>horas</span></div>
          <div><input type="number" id="timerMinInput" min="0" max="59" value="5" oninput="timerInputsChanged()"><span>min</span></div>
          <div><input type="number" id="timerSecInput" min="0" max="59" value="0" oninput="timerInputsChanged()"><span>seg</span></div>
        </div>
        <div class="timer-presets" id="timerPresets">
          <button class="chip" onclick="setTimerPreset(60)">1 min</button>
          <button class="chip" onclick="setTimerPreset(180)">3 min</button>
          <button class="chip" onclick="setTimerPreset(300)">5 min</button>
          <button class="chip" onclick="setTimerPreset(600)">10 min</button>
          <button class="chip" onclick="setTimerPreset(900)">15 min</button>
          <button class="chip" onclick="setTimerPreset(1800)">30 min</button>
          <button class="chip" onclick="setTimerPreset(3600)">1 h</button>
        </div>
        <div class="timer-controls">
          <button class="ctrlbtn" id="timerResetBtn" onclick="timerReset()">Reiniciar</button>
          <button class="ctrlbtn primary" id="timerStartBtn" onclick="timerToggle()">Iniciar</button>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- Modal: nueva alarma -->
<div class="modal-overlay" id="alarmModal" hidden>
  <div class="modal">
    <h3 id="alarmModalTitle">Nueva alarma</h3>
    <input type="time" id="alarmTimeInput" value="07:00">
    <input type="text" id="alarmLabelInput" placeholder="Etiqueta (opcional)" maxlength="30">
    <div class="chips" id="alarmPresetChips">
      <button class="chip" data-preset="once" onclick="pickRepeatPreset('once')">Una vez</button>
      <button class="chip on" data-preset="daily" onclick="pickRepeatPreset('daily')">Diaria</button>
      <button class="chip" data-preset="week" onclick="pickRepeatPreset('week')">Entre semana</button>
      <button class="chip" data-preset="weekend" onclick="pickRepeatPreset('weekend')">Fin de semana</button>
    </div>
    <div class="daychips" id="alarmDayChips"></div>
    <div class="modal-btns">
      <button class="btn-ghost" onclick="closeAlarmModal()">Cancelar</button>
      <button class="btn-primary" onclick="saveAlarm()">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal: añadir ciudad -->
<div class="modal-overlay center" id="cityModal" hidden>
  <div class="modal">
    <h3>Añadir ciudad</h3>
    <input type="search" id="citySearchInput" placeholder="Buscar ciudad…" oninput="filterCityList()">
    <ul class="city-pick" id="cityPickList"></ul>
    <div class="modal-btns">
      <button class="btn-ghost" onclick="closeCityModal()">Cerrar</button>
    </div>
  </div>
</div>

<!-- Alarma sonando -->
<div id="ringOverlay" hidden>
  <div class="ring-clock" id="ringTime">--:--</div>
  <div class="ring-label" id="ringLabel">Alarma</div>
  <div class="ring-now" id="ringNow"></div>
  <div class="ring-btns">
    <button id="ringSnoozeBtn" onclick="ringSnooze()">Posponer 5 min</button>
    <button id="ringDismissBtn" onclick="ringDismiss()">Apagar</button>
  </div>
</div>

<div id="toast"></div>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var two = function (n) { return String(n).padStart(2, "0"); };
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  var toastTimer = null;
  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2300);
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  var hour12 = !store.get("clock24h", true);
  function fmtTime(d, sec) {
    var h = d.getHours(), m = d.getMinutes(), s = d.getSeconds();
    if (!hour12) return two(h) + ":" + two(m) + (sec ? ":" + two(s) : "");
    var ap = h < 12 ? "a. m." : "p. m.";
    h = h % 12; if (h === 0) h = 12;
    return two(h) + ":" + two(m) + (sec ? ":" + two(s) : "") + " " + ap;
  }
  function displayHM(t) {
    var p = t.split(":").map(Number);
    var d = new Date(); d.setHours(p[0], p[1], 0, 0);
    return fmtTime(d, false);
  }
  var fmtLong = new Intl.DateTimeFormat("es-ES", { weekday: "long", day: "numeric", month: "long" });
  var fmtShort = new Intl.DateTimeFormat("es-ES", { weekday: "short", day: "numeric", month: "short" });
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  window.toggleHour12 = function () {
    hour12 = !hour12;
    store.set("clock24h", !hour12);
    $("h12Btn").textContent = hour12 ? "12h" : "24h";
    renderAlarms(); renderCities(); updateClockNow();
  };

  /* ================= Pestañas ================= */
  var TABS = ["alarm", "world", "stopwatch", "timer"];
  var ACCENTS = {
    alarm: ["#ffb054", "rgba(255,176,84,.16)"],

  window.setTimerPreset = function (sec) {
    if (tmrState === "running") return;
    $("timerHourInput").value = Math.floor(sec / 3600);
    $("timerMinInput").value = Math.floor((sec % 3600) / 60);
    $("timerSecInput").value = sec % 60;
    timerInputsChanged();
    toast(fmtCountdown(sec * 1000));
  };
  function setInputsDisabled(dis) {
    ["timerHourInput", "timerMinInput", "timerSecInput"].forEach(function (id) { $(id).disabled = dis; });
    var chips = $("timerPresets").children;
    for (var i = 0; i < chips.length; i++) chips[i].disabled = dis;
  }
  window.timerToggle = function () {
    if (tmrState === "idle") {
      var total = timerTotalMs();
      if (!total) { toast("Elige una duración"); return; }
      tmrTotal = total;
      tmrEnd = Date.now() + total;
      tmrState = "running";
      tmrInt = setInterval(timerTick, 100);
      setInputsDisabled(true);
      syncWake();
    } else if (tmrState === "running") {
      tmrRemain = Math.max(0, tmrEnd - Date.now());
      tmrState = "paused";
      clearInterval(tmrInt); tmrInt = null;
      setInputsDisabled(false);
      syncWake();
    } else {
      tmrEnd = Date.now() + tmrRemain;
      tmrState = "running";
      tmrInt = setInterval(timerTick, 100);
      setInputsDisabled(true);
      syncWake();
    }
    updateTimerUI();
  };
  function timerTick() {
    var remain = tmrEnd - Date.now();
    if (remain <= 0) { finishTimer(); return; }
    $("timerTime").textContent = fmtCountdown(remain);
    $("ringFg").style.strokeDashoffset = String(RING_C * (1 - remain / tmrTotal));
  }
  function finishTimer() {
    clearInterval(tmrInt); tmrInt = null;
    tmrState = "idle"; tmrTotal = 0; tmrRemain = 0;
    setInputsDisabled(false);
    syncWake();
    updateTimerUI();
    ringTimer();
    toast("¡Tiempo cumplido!");
  }
  window.timerReset = function () {
    if (tmrInt) { clearInterval(tmrInt); tmrInt = null; }
    tmrState = "idle"; tmrTotal = 0; tmrRemain = 0;
    setInputsDisabled(false);
    updateTimerUI();
    syncWake();
  };

  /* ================= Wake Lock ================= */
  var wakeLock = null;
  function syncWake() {
    var needed = swRunning || tmrState === "running";
    if (needed && !wakeLock) requestWake();
    if (!needed && wakeLock) releaseWake();
  }
  function requestWake() {
    try {
      if ("wakeLock" in navigator) navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {});
    } catch (e) {}
  }
  function releaseWake() {
    try { if (wakeLock) wakeLock.release(); } catch (e) {}
    wakeLock = null;
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && (swRunning || tmrState === "running")) requestWake();
  });

  /* ================= Bucle principal ================= */
  function masterTick() {
    updateClockNow();
    checkAlarms();
    updateCityTimes(new Date());
    if (!$("ringOverlay").hidden && ringMode === "alarm") {
      $("ringNow").textContent = "Ahora: " + fmtTime(new Date(), true);
    }
  }
  function scheduleMinuteCheck() {
    var now = new Date();
    var msToNext = (60 - now.getSeconds()) * 1000 - now.getMilliseconds() + 60;
    setTimeout(function () {
      checkAlarms();
      scheduleMinuteCheck();
    }, msToNext);
  }

  setAccent("alarm");
  document.title = DEFAULT_TITLE;
  renderAlarms();
  renderCities();
  renderLaps();
  updateTimerUI();
  updateClockNow();
  $("h12Btn").textContent = hour12 ? "12h" : "24h";
  setInterval(masterTick, 1000);
  scheduleMinuteCheck();
})();
</script>
