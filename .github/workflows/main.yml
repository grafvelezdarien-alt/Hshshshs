name: Compilar APK con Config XML

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Cordova
        run: |
          npm install -g cordova

      - name: Crear proyecto Android y usar config.xml
        run: |
          cordova create app com.juego.pario Pario
          cd app
          rm -rf www/*
          cp -r ../* www/ 2>/dev/null || true
          
          # Copiar tu config.xml personalizado si existe
          if [ -f ../config.xml ]; then cp ../config.xml config.xml; fi
          
          cordova platform add android
          cordova build android --debug

      - name: Subir archivo APK
        uses: actions/upload-artifact@v4
        with:
          name: Juego-Pario-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
