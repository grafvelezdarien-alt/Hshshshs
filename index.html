<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Reloj App</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); display: flex; flex-direction: column; height: 100vh; justify-content: space-between; }
    
    header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--card-bg); }
    header h1 { font-size: 1.2rem; color: var(--accent); }
    .toggle-format { background: #334155; border: none; color: var(--text); padding: 6px 12px; border-radius: 20px; font-weight: bold; cursor: pointer; }

    main { flex: 1; padding: 20px; overflow-y: auto; }
    .tab-content { display: none; text-align: center; }
    .tab-content.active { display: block; }

    /* Reloj Principal */
    .big-clock { font-size: 3.5rem; font-weight: 300; margin: 20px 0; color: var(--text); }

    /* Botones y Formularios */
    .btn { background: var(--accent); color: #000; border: none; padding: 12px 24px; border-radius: 25px; font-weight: bold; font-size: 1rem; cursor: pointer; margin: 5px; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-secondary { background: #334155; color: var(--text); }
    
    .card-list { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
    .card { background: var(--card-bg); padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }

    /* Navegación Inferior */
    nav { display: flex; background: var(--card-bg); border-top: 1px solid #334155; }
    nav button { flex: 1; background: none; border: none; color: var(--subtext); padding: 15px 0; font-size: 0.9rem; cursor: pointer; }
    nav button.active { color: var(--accent); font-weight: bold; border-top: 2px solid var(--accent); }

    /* Cronómetro y Laps */
    .lap-item { display: flex; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid #334155; }
    .lap-fastest { color: var(--success); }
    .lap-slowest { color: var(--danger); }

    /* Inputs */
    input[type="time"], input[type="number"], select { background: #334155; border: 1px solid #475569; color: var(--text); padding: 8px; border-radius: 8px; font-size: 1rem; margin: 5px; }
  </style>
</head>
<body>

  <header>
    <h1>Reloj</h1>
    <button class="toggle-format" id="formatBtn" onclick="toggleFormat()">24h</button>
  </header>

  <main>
    <!-- TAB 1: ALARMA -->
    <section id="alarma" class="tab-content active">
      <div class="big-clock" id="mainClock">00:00:00</div>
      <div>
        <input type="time" id="alarmTime">
        <button class="btn" onclick="addAlarm()">+ Añadir Alarma</button>
      </div>
      <div class="card-list" id="alarmList"></div>
    </section>

    <!-- TAB 2: MUNDIAL -->
    <section id="mundial" class="tab-content">
      <div style="margin-bottom: 15px;">
        <select id="citySelect">
          <option value="0">Londres (UTC)</option>
          <option value="1">Madrid (UTC+1)</option>
          <option value="-3">Buenos Aires (UTC-3)</option>
          <option value="-5">Nueva York (UTC-5)</option>
          <option value="-6">Ciudad de México (UTC-6)</option>
          <option value="9">Tokio (UTC+9)</option>
        </select>
        <button class="btn" onclick="addWorldCity()">Añadir Ciudad</button>
      </div>
      <div class="card-list" id="worldList"></div>
    </section>

    <!-- TAB 3: CRONÓMETRO -->
    <section id="cronometro" class="tab-content">
      <div class="big-clock" id="swDisplay">00:00.00</div>
      <div>
        <button class="btn" id="swStartBtn" onclick="toggleStopwatch()">Iniciar</button>
        <button class="btn btn-secondary" onclick="recordLap()">Vuelta</button>
        <button class="btn btn-danger" onclick="resetStopwatch()">Reiniciar</button>
      </div>
      <div class="card-list" id="lapList" style="margin-top:20px;"></div>
    </section>

    <!-- TAB 4: TEMPORIZADOR -->
    <section id="temporizador" class="tab-content">
      <div class="big-clock" id="timerDisplay">00:00:00</div>
      <div style="margin-bottom: 15px;">
        <button class="btn btn-secondary" onclick="setTimerPreset(60)">1 min</button>
        <button class="btn btn-secondary" onclick="setTimerPreset(300)">5 min</button>
        <button class="btn btn-secondary" onclick="setTimerPreset(900)">15 min</button>
      </div>
      <div>
        <input type="number" id="timerMins" placeholder="Min" min="0" style="width: 70px;">
        <input type="number" id="timerSecs" placeholder="Seg" min="0" style="width: 70px;">
        <button class="btn" id="timerStartBtn" onclick="toggleTimer()">Iniciar</button>
        <button class="btn btn-danger" onclick="resetTimer()">Reiniciar</button>
      </div>
    </section>
  </main>

  <nav>
    <button class="nav-btn active" onclick="switchTab('alarma', this)">Alarma</button>
    <button class="nav-btn" onclick="switchTab('mundial', this)">Mundial</button>
    <button class="nav-btn" onclick="switchTab('cronometro', this)">Cronómetro</button>
    <button class="nav-btn" onclick="switchTab('temporizador', this)">Temporizador</button>
  </nav>

  <script>
    let is24h = true;
    let alarms = [];
    let worldCities = [];

    function toggleFormat() {
      is24h = !is24h;
      document.getElementById('formatBtn').innerText = is24h ? '24h' : '12h';
      updateClock();
    }

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    // RELOJ Y ALARMAS
    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      let ampm = '';

      if (!is24h) {
        ampm = hours >= 12 ? ' PM' : ' AM';
        hours = hours % 12 || 12;
      }
      
      const currentTimeStr = `${String(hours).padStart(2, '0')}:${minutes}`;
      document.getElementById('mainClock').innerText = `${currentTimeStr}:${seconds}${ampm}`;

      // Comprobar alarmas
      alarms.forEach((a, i) => {
        if (a.active && a.time === currentTimeStr && now.getSeconds() === 0) {
          alert(`⏰ ¡Alarma activa! (${a.time})`);
        }
      });

      // Actualizar Relojes Mundiales
      updateWorldTimes();
    }
    setInterval(updateClock, 1000);

    function addAlarm() {
      const timeVal = document.getElementById('alarmTime').value;
      if (!timeVal) return;
      alarms.push({ time: timeVal, active: true });
      renderAlarms();
    }

    function renderAlarms() {
      const container = document.getElementById('alarmList');
      container.innerHTML = '';
      alarms.forEach((a, index) => {
        container.innerHTML += `
          <div class="card">
            <span>⏰ ${a.time}</span>
            <div>
              <input type="checkbox" ${a.active ? 'checked' : ''} onchange="alarms[${index}].active = this.checked">
              <button class="btn btn-danger" style="padding:4px 8px;" onclick="alarms.splice(${index},1); renderAlarms();">✕</button>
            </div>
          </div>`;
      });
    }

    // RELOJ MUNDIAL
    function addWorldCity() {
      const select = document.getElementById('citySelect');
      const offset = parseInt(select.value);
      const cityName = select.options[select.selectedIndex].text.split(' ')[0];
      if (!worldCities.some(c => c.name === cityName)) {
        worldCities.push({ name: cityName, offset });
        renderWorld();
      }
    }

    function updateWorldTimes() {
      worldCities.forEach((city, index) => {
        const el = document.getElementById(`world-${index}`);
        if (el) {
          const now = new Date();
          const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
          const cityTime = new Date(utc + (3600000 * city.offset));
          el.innerText = cityTime.toLocaleTimeString();
        }
      });
    }

    function renderWorld() {
      const container = document.getElementById('worldList');
      container.innerHTML = '';
      worldCities.forEach((c, i) => {
        container.innerHTML += `
          <div class="card">
            <span>🌐 ${c.name}</span>
            <span id="world-${i}">00:00:00</span>
            <button class="btn btn-danger" style="padding:4px 8px;" onclick="worldCities.splice(${i},1); renderWorld();">✕</button>
          </div>`;
      });
      updateWorldTimes();
    }

    // CRONÓMETRO
    let swInterval, swTime = 0, swRunning = false, laps = [];
    function toggleStopwatch() {
      if (swRunning) {
        clearInterval(swInterval);
        document.getElementById('swStartBtn').innerText = 'Reanudar';
      } else {
        swInterval = setInterval(() => {
          swTime += 10;
          let m = Math.floor(swTime / 60000);
          let s = Math.floor((swTime % 60000) / 1000);
          let ms = Math.floor((swTime % 1000) / 10);
          document.getElementById('swDisplay').innerText = 
            `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(ms).padStart(2,'0')}`;
        }, 10);
        document.getElementById('swStartBtn').innerText = 'Pausar';
      }
      swRunning = !swRunning;
    }

    function recordLap() {
      if (swTime > 0) {
        laps.push(swTime);
        renderLaps();
      }
    }

    function renderLaps() {
      const container = document.getElementById('lapList');
      container.innerHTML = '';
      if (laps.length === 0) return;
      
      const min = Math.min(...laps);
      const max = Math.max(...laps);

      laps.forEach((l, i) => {
        let m = Math.floor(l / 60000);
        let s = Math.floor((l % 60000) / 1000);
        let ms = Math.floor((l % 1000) / 10);
        let classColor = '';
        if (laps.length > 1) {
          if (l === min) classColor = 'lap-fastest';
          if (l === max) classColor = 'lap-slowest';
        }
        container.innerHTML = `
          <div class="lap-item ${classColor}">
            <span>Vuelta ${i + 1}</span>
            <span>${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(ms).padStart(2,'0')}</span>
          </div>` + container.innerHTML;
      });
    }

    function resetStopwatch() {
      clearInterval(swInterval);
      swTime = 0; swRunning = false; laps = [];
      document.getElementById('swDisplay').innerText = '00:00.00';
      document.getElementById('swStartBtn').innerText = 'Iniciar';
      document.getElementById('lapList').innerHTML = '';
    }

    // TEMPORIZADOR
    let timerInterval, timerSeconds = 0, timerRunning = false;
    function setTimerPreset(sec) {
      resetTimer();
      timerSeconds = sec;
      updateTimerDisplay();
    }

    function toggleTimer() {
      if (!timerRunning) {
        if (timerSeconds === 0) {
          const m = parseInt(document.getElementById('timerMins').value) || 0;
          const s = parseInt(document.getElementById('timerSecs').value) || 0;
          timerSeconds = (m * 60) + s;
        }
        if (timerSeconds <= 0) return;

        timerInterval = setInterval(() => {
          timerSeconds--;
          updateTimerDisplay();
          if (timerSeconds <= 0) {
            clearInterval(timerInterval);
            alert("⏳ ¡Tiempo terminado!");
            resetTimer();
          }
        }, 1000);
        document.getElementById('timerStartBtn').innerText = 'Pausar';
      } else {
        clearInterval(timerInterval);
        document.getElementById('timerStartBtn').innerText = 'Reanudar';
      }
      timerRunning = !timerRunning;
    }

    function updateTimerDisplay() {
      let h = Math.floor(timerSeconds / 3600);
      let m = Math.floor((timerSeconds % 3600) / 60);
      let s = timerSeconds % 60;
      document.getElementById('timerDisplay').innerText = 
        `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerSeconds = 0; timerRunning = false;
      document.getElementById('timerStartBtn').innerText = 'Iniciar';
      document.getElementById('timerDisplay').innerText = '00:00:00';
    }
  </script>
</body>
</html>
